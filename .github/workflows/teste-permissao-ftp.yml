# TEMPORARIO. Descobre por que o efbitapira01 recebe 550 ao gravar.
# Envia um arquivo de teste inofensivo, confere e apaga logo depois.
# Nao toca em nenhum arquivo de producao. Sera removido apos o teste.
name: Teste de permissao FTP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar, conferir e apagar um arquivo de teste
        env:
          H: ${{ secrets.KH_FTP_HOST }}
          U: ${{ secrets.KH_FTP_USER }}
          P: ${{ secrets.KH_FTP_PASS }}
        run: |
          echo "arquivo de teste do IAieu, pode apagar" > teste-permissao-ftp.txt

          r=$(mktemp); trap 'rm -f "$r"' EXIT
          {
            echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "pwd"
            echo "ls"
            echo "put teste-permissao-ftp.txt"
            echo "bye"
          } > "$r"

          echo "=== onde o usuario cai, e o que ele enxerga ==="
          if lftp -f "$r"; then
            echo "ENVIO DO ARQUIVO NOVO: FUNCIONOU"
            echo "novo=sim" >> $GITHUB_ENV
          else
            echo "ENVIO DO ARQUIVO NOVO: FALHOU"
            echo "novo=nao" >> $GITHUB_ENV
          fi

      - name: Conferir pela web e apagar em seguida
        if: env.novo == 'sim'
        env:
          H: ${{ secrets.KH_FTP_HOST }}
          U: ${{ secrets.KH_FTP_USER }}
          P: ${{ secrets.KH_FTP_PASS }}
        run: |
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://efbitapira.org/teste-permissao-ftp.txt?t=1")
          echo "pela web, antes de apagar: HTTP $c"

          r=$(mktemp); trap 'rm -f "$r"' EXIT
          {
            echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "rm -f teste-permissao-ftp.txt"
            echo "bye"
          } > "$r"
          lftp -f "$r" && echo "ARQUIVO DE TESTE APAGADO"

          sleep 3
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://efbitapira.org/teste-permissao-ftp.txt?t=2")
          echo "pela web, depois de apagar: HTTP $c"

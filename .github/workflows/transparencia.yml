# Regenera a pagina de Transparencia quando a lista de documentos muda.
#
# Quem edita pelo painel administrativo altera apenas
# transparencia/documentos.json e envia os PDFs para
# transparencia/arquivos/. Este processo cuida do resto: refaz o
# HTML e devolve ao repositorio, e o site entra no ar sozinho.
#
# Nao toca na home nem na pagina de doacao, e nao precisa da pasta
# fotos/, que continua fora do repositorio.

name: Publicar Transparencia

# Os dois caminhos que disparam sozinhos sao os do painel: a lista de
# documentos e os PDFs. Sao as unicas coisas que o William mexe, e ele
# nao roda build nenhum, entao a pagina precisa se refazer por conta.
#
# template-transparencia.html saiu desta lista em 29/08/2026. Editar o
# template e trabalho de desenvolvedor, e desenvolvedor ja gera a pagina
# na propria maquina e commita junto. Deixar o template aqui fazia um
# push de trabalho em andamento publicar sozinho. Para regenerar a
# pagina a mao: Actions, Publicar Transparencia, Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'transparencia/documentos.json'
      - 'transparencia/arquivos/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transparencia
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Versao TRAVADA, e nao por preciosismo.
      #
      # Sem numero, o npm instala a mais recente do dia. As fontes entram
      # embutidas na pagina em base64, entao um @fontsource novo muda os
      # bytes do arquivo gerado. Este processo commita quando a pagina
      # muda e publica em seguida. Resultado: no dia em que sair uma
      # versao nova, o proximo PDF que o William subir troca as fontes do
      # site, commita sozinho e publica. Ninguem decidiu e ninguem
      # percebe.
      #
      # Trocar de versao passa a ser ato deliberado: muda-se aqui e no
      # package.json, na mesma linha, e roda-se o build na mao para ver
      # o que mudou antes de deixar o painel publicar.
      - name: Instalar as fontes do site
        run: npm install --no-save @fontsource/archivo@5.3.0 @fontsource/inter@5.3.0

      - name: Gerar a pagina
        run: python3 build-transparencia.py

      - name: Publicar se houve mudanca
        run: |
          if git diff --quiet -- transparencia/index.html; then
            echo "A pagina nao mudou. Nada a publicar."
            exit 0
          fi
          git config user.name  "Painel da Transparencia"
          git config user.email "acoes@users.noreply.github.com"
          git add transparencia/index.html
          git commit -m "Transparencia: pagina atualizada pelo painel"
          git push

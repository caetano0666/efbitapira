# TEMPORARIO. Teste isolado de escrita na raiz, em paralelo ao teste
# que a KingHost esta fazendo pelo FileZilla.
# Nao cria pasta. Nao toca em arquivo existente. Sera removido depois.
name: Teste de escrita FTP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Listar a raiz
        env:
          H: ${{ secrets.KH_FTP_HOST }}
          U: ${{ secrets.KH_FTP_USER }}
          P: ${{ secrets.KH_FTP_PASS }}
        run: |
          r=$(mktemp); trap 'rm -f "$r"' EXIT
          {
            echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "echo --- pwd ---"
            echo "pwd"
            echo "echo --- ls -la ---"
            echo "ls -la"
            echo "echo --- ls da raiz absoluta ---"
            echo "ls -la /"
            echo "bye"
          } > "$r"
          lftp -f "$r" || echo "LISTAGEM: falhou"

      - name: Criar somente /teste-github.txt
        id: criar
        continue-on-error: true
        env:
          H: ${{ secrets.KH_FTP_HOST }}
          U: ${{ secrets.KH_FTP_USER }}
          P: ${{ secrets.KH_FTP_PASS }}
        run: |
          echo "teste do GitHub Actions, pode apagar" > teste-github.txt
          r=$(mktemp); trap 'rm -f "$r"' EXIT
          {
            echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "put teste-github.txt -o teste-github.txt"
            echo "echo --- confirmando pela listagem ---"
            echo "ls -la teste-github.txt"
            echo "bye"
          } > "$r"
          lftp -f "$r"

      - name: Remover imediatamente o arquivo de teste
        if: steps.criar.outcome == 'success'
        env:
          H: ${{ secrets.KH_FTP_HOST }}
          U: ${{ secrets.KH_FTP_USER }}
          P: ${{ secrets.KH_FTP_PASS }}
        run: |
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://efbitapira.org/teste-github.txt?a=1")
          echo "pela web antes de remover: HTTP $c"
          r=$(mktemp); trap 'rm -f "$r"' EXIT
          {
            echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "rm -f teste-github.txt"
            echo "echo --- deve dar erro de nao encontrado ---"
            echo "ls -la teste-github.txt"
            echo "bye"
          } > "$r"
          lftp -f "$r" || true
          echo "REMOCAO: executada"
          sleep 3
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://efbitapira.org/teste-github.txt?b=1")
          echo "pela web depois de remover: HTTP $c"

      - name: Resultado
        if: always()
        run: |
          echo "criacao: ${{ steps.criar.outcome }}"

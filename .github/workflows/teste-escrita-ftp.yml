# TEMPORARIO. Teste controlado com a senha definitiva.
# Nao toca em nenhum arquivo do site. Removido apos o teste.
name: Teste de escrita FTP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      H: ${{ secrets.KH_FTP_HOST }}
      U: ${{ secrets.KH_FTP_USER }}
      P: ${{ secrets.KH_FTP_PASS }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 1 e 2. Autenticar e listar a raiz
        run: |
          r=$(mktemp)
          { echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "set net:max-retries 1"
            echo "set net:timeout 20"
            echo "ls -la"
            echo "bye"; } > "$r"
          lftp -f "$r"; rm -f "$r"
          echo "AUTENTICACAO: PASSOU"
          echo "LISTAGEM: PASSOU"

      - name: 3 e 4. Criar teste-github.txt e confirmar
        run: |
          echo "teste do GitHub Actions, pode apagar" > teste-github.txt
          r=$(mktemp)
          { echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "set net:max-retries 1"
            echo "set net:timeout 20"
            echo "put teste-github.txt -o teste-github.txt"
            echo "echo --- confirmacao ---"
            echo "ls -la teste-github.txt"
            echo "bye"; } > "$r"
          lftp -f "$r"; rm -f "$r"
          echo "CRIACAO: PASSOU"

      - name: 5 e 6. Apagar e confirmar a remocao
        run: |
          r=$(mktemp)
          { echo "open -u \"$U,$P\" \"ftp://$H\""
            echo "set ftp:ssl-allow no"
            echo "set ftp:passive-mode true"
            echo "set net:max-retries 1"
            echo "set net:timeout 20"
            echo "rm -f teste-github.txt"
            echo "echo --- a raiz depois de apagar ---"
            echo "ls -la"
            echo "bye"; } > "$r"
          lftp -f "$r"; rm -f "$r"
